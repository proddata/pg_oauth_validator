name: pg-oauth-validator-rpm-test

services:
  fedora43:
    image: pg-oauth-validator-rpm-test:fedora43
    platform: linux/amd64
    build:
      context: .
      dockerfile: tools/rpm/Containerfile
      args:
        BASE_IMAGE: fedora:43@sha256:a651ddf48ea28a06ed4e1e6519f51c9f47e7a5a138722ade87369b8fbb7e5b42
        RPM_PLATFORM: fedora43
        PG_CONFIG_PATH: /usr/bin/pg_server_config
    working_dir: /workspace
    volumes:
      - .:/workspace:ro
      - fedora43-build:/build
    tmpfs:
      - /source:exec
    command:
      - verify-dev
      - packagecheck

  fedora44:
    image: pg-oauth-validator-rpm-test:fedora44
    platform: linux/amd64
    build:
      context: .
      dockerfile: tools/rpm/Containerfile
      args:
        BASE_IMAGE: fedora:44@sha256:43b29f65a41eb9c35e1cd5323e3bdf3b655c2357a9f4f1ff2f9c2798e5045d80
        RPM_PLATFORM: fedora44
        PG_CONFIG_PATH: /usr/bin/pg_server_config
    working_dir: /workspace
    volumes:
      - .:/workspace:ro
      - fedora44-build:/build
    tmpfs:
      - /source:exec
    command:
      - verify-dev
      - packagecheck

  rocky10:
    image: pg-oauth-validator-rpm-test:rocky10
    platform: linux/amd64
    build:
      context: .
      dockerfile: tools/rpm/Containerfile
      args:
        BASE_IMAGE: rockylinux/rockylinux:10@sha256:827d37bc128288ccf160ee318bb3cb92d591164cb217e92f8bc61e3982ae1834
        RPM_PLATFORM: el10
        PG_CONFIG_PATH: /usr/pgsql-18/bin/pg_config
    working_dir: /workspace
    volumes:
      - .:/workspace:ro
      - rocky10-build:/build
    tmpfs:
      - /source:exec
    command:
      - verify-dev
      - packagecheck

volumes:
  fedora43-build:
  fedora44-build:
  rocky10-build:
