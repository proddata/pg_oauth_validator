name: pg-oauth-validator-rpm-test

services:
  fedora43:
    image: pg-oauth-validator-rpm-test:fedora43
    platform: linux/amd64
    build:
      context: .
      dockerfile: tools/rpm/Containerfile
      args:
        BASE_IMAGE: fedora:43@sha256:a651ddf48ea28a06ed4e1e6519f51c9f47e7a5a138722ade87369b8fbb7e5b42
        RPM_PLATFORM: fedora43
        PG_CONFIG_PATH: /usr/bin/pg_server_config
    working_dir: /workspace
    volumes:
      - .:/workspace:ro
      - fedora43-build:/build
    tmpfs:
      - /source:exec
    command:
      - verify-dev
      - packagecheck

  fedora44:
    image: pg-oauth-validator-rpm-test:fedora44
    platform: linux/amd64
    build:
      context: .
      dockerfile: tools/rpm/Containerfile
      args:
        BASE_IMAGE: fedora:44@sha256:43b29f65a41eb9c35e1cd5323e3bdf3b655c2357a9f4f1ff2f9c2798e5045d80
        RPM_PLATFORM: fedora44
        PG_CONFIG_PATH: /usr/bin/pg_server_config
    working_dir: /workspace
    volumes:
      - .:/workspace:ro
      - fedora44-build:/build
    tmpfs:
      - /source:exec
    command:
      - verify-dev
      - packagecheck

  rocky9:
    image: pg-oauth-validator-rpm-test:rocky9
    platform: linux/amd64
    build:
      context: .
      dockerfile: tools/rpm/Containerfile
      args:
        BASE_IMAGE: rockylinux:9@sha256:d7be1c094cc5845ee815d4632fe377514ee6ebcf8efaed6892889657e5ddaaa6
        RPM_PLATFORM: el9
        PG_CONFIG_PATH: /usr/pgsql-18/bin/pg_config
    working_dir: /workspace
    volumes:
      - .:/workspace:ro
      - rocky9-build:/build
    tmpfs:
      - /source:exec
    command:
      - verify-dev
      - packagecheck

volumes:
  fedora43-build:
  fedora44-build:
  rocky9-build:
