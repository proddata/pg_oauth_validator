name: RPM platform compatibility

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rpm-platforms-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.distribution.name }} / PostgreSQL 18${{ matrix.architecture.name_suffix }}
    runs-on: ${{ matrix.architecture.runner }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        distribution:
          - name: Fedora 43
            image_name: fedora43
            base_image: fedora:43@sha256:a651ddf48ea28a06ed4e1e6519f51c9f47e7a5a138722ade87369b8fbb7e5b42
            rpm_platform: fedora43
            pg_config: /usr/bin/pg_server_config
          - name: Fedora 44
            image_name: fedora44
            base_image: fedora:44@sha256:43b29f65a41eb9c35e1cd5323e3bdf3b655c2357a9f4f1ff2f9c2798e5045d80
            rpm_platform: fedora44
            pg_config: /usr/bin/pg_server_config
          - name: Rocky Linux 10 / PGDG
            image_name: rocky10
            base_image: rockylinux/rockylinux:10@sha256:827d37bc128288ccf160ee318bb3cb92d591164cb217e92f8bc61e3982ae1834
            rpm_platform: el10
            pg_config: /usr/pgsql-18/bin/pg_config
        architecture:
          - name_suffix: ''
            runner: ubuntu-24.04
            platform: linux/amd64
            host_arch: x86_64
            image_suffix: amd64
          - name_suffix: ' / arm64'
            runner: ubuntu-24.04-arm
            platform: linux/arm64
            host_arch: aarch64
            image_suffix: arm64

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Build compatibility image
        env:
          BASE_IMAGE: ${{ matrix.distribution.base_image }}
          IMAGE_NAME: ${{ matrix.distribution.image_name }}-${{ matrix.architecture.image_suffix }}
          PG_CONFIG_PATH: ${{ matrix.distribution.pg_config }}
          RPM_PLATFORM: ${{ matrix.distribution.rpm_platform }}
          DOCKER_PLATFORM: ${{ matrix.architecture.platform }}
          EXPECTED_HOST_ARCH: ${{ matrix.architecture.host_arch }}
        run: |
          test "$(uname -m)" = "$EXPECTED_HOST_ARCH"
          docker build \
            --platform "$DOCKER_PLATFORM" \
            --file tools/rpm/Containerfile \
            --build-arg BASE_IMAGE="$BASE_IMAGE" \
            --build-arg RPM_PLATFORM="$RPM_PLATFORM" \
            --build-arg PG_CONFIG_PATH="$PG_CONFIG_PATH" \
            --tag "pg-oauth-validator-rpm-test:$IMAGE_NAME" \
            .

      - name: Verify build and installed OAuth runtime
        env:
          IMAGE_NAME: ${{ matrix.distribution.image_name }}-${{ matrix.architecture.image_suffix }}
          DOCKER_PLATFORM: ${{ matrix.architecture.platform }}
        run: |
          docker run --rm --tmpfs /source:exec \
            --platform "$DOCKER_PLATFORM" \
            --volume "$GITHUB_WORKSPACE:/workspace:ro" \
            "pg-oauth-validator-rpm-test:$IMAGE_NAME" \
            verify-dev installedcheck

      - name: Test RPM source preparation
        run: python3 tests/ci/test_rpm_sources.py

      - name: Prepare immutable RPM inputs offline
        env:
          IMAGE_NAME: ${{ matrix.distribution.image_name }}-${{ matrix.architecture.image_suffix }}
          DOCKER_PLATFORM: ${{ matrix.architecture.platform }}
        run: |
          docker run --rm --network=none --entrypoint python3 \
            --platform "$DOCKER_PLATFORM" \
            --volume "$GITHUB_WORKSPACE:/workspace:ro" \
            --volume "$RUNNER_TEMP:/output" \
            "pg-oauth-validator-rpm-test:$IMAGE_NAME" \
            /workspace/scripts/ci/prepare-rpm-sources.py prepare \
            0.0.0 "$GITHUB_SHA" /opt/rpm-dependencies /output/rpm-inputs

      - name: Build RPM offline and test installed package
        env:
          IMAGE_NAME: ${{ matrix.distribution.image_name }}-${{ matrix.architecture.image_suffix }}
          DOCKER_PLATFORM: ${{ matrix.architecture.platform }}
        run: |
          docker run --rm --network=none --tmpfs /source:exec --entrypoint /bin/sh \
            --platform "$DOCKER_PLATFORM" \
            --volume "$GITHUB_WORKSPACE:/workspace:ro" \
            --volume "$RUNNER_TEMP/rpm-inputs:/inputs:ro" \
            "pg-oauth-validator-rpm-test:$IMAGE_NAME" \
            /workspace/scripts/ci/test-rpm-package.sh /inputs
