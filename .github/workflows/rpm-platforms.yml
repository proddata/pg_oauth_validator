name: RPM platform compatibility

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rpm-platforms-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }} / PostgreSQL 18
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Fedora 43
            image_name: fedora43
            base_image: fedora:43@sha256:a651ddf48ea28a06ed4e1e6519f51c9f47e7a5a138722ade87369b8fbb7e5b42
            rpm_platform: fedora43
            pg_config: /usr/bin/pg_server_config
          - name: Fedora 44
            image_name: fedora44
            base_image: fedora:44@sha256:43b29f65a41eb9c35e1cd5323e3bdf3b655c2357a9f4f1ff2f9c2798e5045d80
            rpm_platform: fedora44
            pg_config: /usr/bin/pg_server_config
          - name: Rocky Linux 10 / PGDG
            image_name: rocky10
            base_image: rockylinux/rockylinux:10@sha256:827d37bc128288ccf160ee318bb3cb92d591164cb217e92f8bc61e3982ae1834
            rpm_platform: el10
            pg_config: /usr/pgsql-18/bin/pg_config

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Build compatibility image
        env:
          BASE_IMAGE: ${{ matrix.base_image }}
          IMAGE_NAME: ${{ matrix.image_name }}
          PG_CONFIG_PATH: ${{ matrix.pg_config }}
          RPM_PLATFORM: ${{ matrix.rpm_platform }}
        run: |
          docker build \
            --platform linux/amd64 \
            --file tools/rpm/Containerfile \
            --build-arg BASE_IMAGE="$BASE_IMAGE" \
            --build-arg RPM_PLATFORM="$RPM_PLATFORM" \
            --build-arg PG_CONFIG_PATH="$PG_CONFIG_PATH" \
            --tag "pg-oauth-validator-rpm-test:$IMAGE_NAME" \
            .

      - name: Verify build and staged installation
        env:
          IMAGE_NAME: ${{ matrix.image_name }}
        run: |
          docker run --rm --tmpfs /source:exec \
            --platform linux/amd64 \
            --volume "$GITHUB_WORKSPACE:/workspace:ro" \
            "pg-oauth-validator-rpm-test:$IMAGE_NAME" \
            verify-dev packagecheck
