name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: PostgreSQL ${{ matrix.pg }} / ${{ matrix.compiler }} / C17
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - pg: "18"
            package: "18"
            target: "test-pg18"
            compiler: GCC
            cc: gcc
            image: postgres:18-bookworm@sha256:882236b897e39051d2368c5ccc6cda944904723506b2dfc97f2a8f5bc9afa382
          - pg: "18"
            package: "18"
            target: "test-pg18"
            compiler: Clang
            cc: clang
            image: postgres:18-bookworm@sha256:882236b897e39051d2368c5ccc6cda944904723506b2dfc97f2a8f5bc9afa382
          - pg: "19 beta 2"
            package: "19"
            target: "test-pg19"
            compiler: GCC
            cc: gcc
            image: postgres:19beta2-bookworm@sha256:9222211d932c983331df86f01a6224eba868d61000a334e4a3e613626cf884f0
          - pg: "19 beta 2"
            package: "19"
            target: "test-pg19"
            compiler: Clang
            cc: clang
            image: postgres:19beta2-bookworm@sha256:9222211d932c983331df86f01a6224eba868d61000a334e4a3e613626cf884f0
    container:
      image: ${{ matrix.image }}

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install build dependencies
        run: ./scripts/ci/install-debian-dependencies.sh ${{ matrix.package }}

      - name: Install pinned PIC static Jansson dependency
        run: CC=${{ matrix.cc }} ./scripts/ci/install-jansson.sh

      - name: Install pinned libjwt spike dependency
        run: CC=${{ matrix.cc }} ./scripts/ci/install-libjwt.sh

      - name: Validate libjwt behavior under sanitizers
        if: matrix.pg == '19 beta 2' && matrix.compiler == 'Clang'
        run: |
          make sanitizercheck
          make fuzz-smoke
          make clean

      - name: Build and test in isolated tree
        run: make ${{ matrix.target }} CC=${{ matrix.cc }}

      - name: Validate staged and installed package
        if: matrix.compiler == 'GCC'
        run: make installedcheck

      - name: Clean and reject untracked build products
        if: always()
        run: |
          make clean-pg${{ matrix.package }}
          make clean
          test -z "$(git status --short)"

  # The pinned PostgreSQL images do not ship Git, so actions/checkout falls back
  # to a source tarball there and the container jobs have no working tree. Run
  # the Git-dependent hygiene checks on the runner, which has Git and Python.
  hygiene:
    name: Source hygiene
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      # Invoke the script directly: the make target loads PGXS, which this job
      # deliberately does not depend on.
      - name: Check source-tree hygiene
        run: ./scripts/ci/check-source-tree.sh

  quality:
    name: C formatting and Clang static analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: postgres:19beta2-bookworm@sha256:9222211d932c983331df86f01a6224eba868d61000a334e4a3e613626cf884f0

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install analysis dependencies
        run: ./scripts/ci/install-debian-dependencies.sh 19

      - name: Install pinned pgindent
        run: ./scripts/ci/install-pgindent.sh

      - name: Check C formatting
        run: make formatcheck

      - name: Install pinned PIC static Jansson dependency
        run: CC=clang ./scripts/ci/install-jansson.sh

      - name: Install pinned libjwt dependency
        run: CC=clang ./scripts/ci/install-libjwt.sh

      - name: Run Clang static analyzer
        run: |
          scan-build --status-bugs --keep-going -o .ci-analysis \
            make verify CC=clang

      - name: Upload static-analysis reports
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: clang-static-analysis
          path: .ci-analysis
          if-no-files-found: ignore
          retention-days: 7

      - name: Clean and reject untracked build products
        if: always()
        run: |
          make clean
          test -z "$(git status --short)"
