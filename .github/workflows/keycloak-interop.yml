name: Keycloak interoperability

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keycloak-interop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  keycloak-26-5:
    name: Keycloak 26.5.0 / PostgreSQL 19 beta 2
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Run isolated interoperability suite
        run: make interop-keycloak

      - name: Reject untracked build products
        if: always()
        run: test -z "$(git status --short)"
