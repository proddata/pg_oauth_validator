services:
  postgres:
    build:
      args:
        POSTGRES_IMAGE: postgres:19beta4-bookworm@sha256:4c618d9a30e0b88078b9371a0499d7055da9ab7f5afe386a460758eac9857f06
        PG_MAJOR: "19"
    image: pg-oauth-validator-playground:pg19beta4
    command:
      - postgres
      - -c
      - config_file=/playground/generated/postgresql.conf
      - -c
      - hba_file=/playground/generated/pg_hba.pg19.conf

  psql:
    image: pg-oauth-validator-playground:pg19beta4

volumes:
  postgres-data:
