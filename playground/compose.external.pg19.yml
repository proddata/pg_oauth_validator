services:
  postgres:
    build:
      args:
        POSTGRES_IMAGE: postgres:19beta3-bookworm@sha256:c2f9db76caf60eda17be053e222349f4f3921b514b30a660c74dd9d9b976806f
        PG_MAJOR: "19"
    image: pg-oauth-validator-playground:pg19beta3
    command:
      - postgres
      - -c
      - config_file=/playground/generated/postgresql.conf
      - -c
      - hba_file=/playground/generated/pg_hba.pg19.conf

  psql:
    image: pg-oauth-validator-playground:pg19beta3

volumes:
  postgres-data:
