name: pg-oauth-validator-external

services:
  certs:
    build:
      context: .
      dockerfile: demo/Containerfile
    image: pg-oauth-validator-demo:pg18
    entrypoint: ["/bin/sh", "/demo/generate-certs.sh"]
    volumes:
      - external-certs:/certs
      - ./demo/generate-certs.sh:/demo/generate-certs.sh:ro
    restart: "no"

  postgres:
    image: pg-oauth-validator-demo:pg18
    command: ["postgres", "-c", "config_file=/demo/postgresql.conf"]
    environment:
      POSTGRES_DB: demo
      POSTGRES_PASSWORD: demo-bootstrap-only
    ports:
      - "127.0.0.1:${DEMO_POSTGRES_PORT:-55432}:5432"
    volumes:
      - external-data:/var/lib/postgresql
      - external-certs:/certs:ro
      - ${OAUTH_CONFIG_DIR:?set OAUTH_CONFIG_DIR to a reviewed local config directory}:/demo/local:ro
      - ${OAUTH_CONFIG_DIR:?set OAUTH_CONFIG_DIR to a reviewed local config directory}/postgresql.conf:/demo/postgresql.conf:ro
      - ${OAUTH_CONFIG_DIR:?set OAUTH_CONFIG_DIR to a reviewed local config directory}/pg_hba.conf:/demo/pg_hba.conf:ro
      - ${OAUTH_CONFIG_DIR:?set OAUTH_CONFIG_DIR to a reviewed local config directory}/pg_ident.conf:/demo/pg_ident.conf:ro
      - ${OAUTH_CONFIG_DIR:?set OAUTH_CONFIG_DIR to a reviewed local config directory}/init.sql:/docker-entrypoint-initdb.d/10-demo.sql:ro
    depends_on:
      certs:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "runuser -u postgres -- psql -d demo -Atqc 'SELECT 1' | grep -qx 1"]
      interval: 2s
      timeout: 2s
      retries: 30

volumes:
  external-data:
  external-certs:
