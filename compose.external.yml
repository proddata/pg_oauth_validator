name: pg-oauth-validator-external

services:
  certs:
    build:
      context: .
      dockerfile: demo/Containerfile
    image: pg-oauth-validator-demo:pg18
    entrypoint: ["/bin/sh", "/demo/generate-certs.sh"]
    volumes:
      - external-certs:/certs
    restart: "no"

  postgres:
    image: pg-oauth-validator-demo:pg18
    entrypoint: ["/bin/sh", "/demo/start-external-postgres.sh"]
    environment:
      POSTGRES_DB: demo
      POSTGRES_PASSWORD: demo-bootstrap-only
    ports:
      - "127.0.0.1:${DEMO_POSTGRES_PORT:-55432}:5432"
    volumes:
      - external-data:/var/lib/postgresql
      - external-certs:/certs:ro
      - type: bind
        source: ${OAUTH_PROFILE:-./demo/local/provider.yml}
        target: /demo/profile.yml
        read_only: true
        bind:
          create_host_path: false
    tmpfs:
      - /demo/runtime
    depends_on:
      certs:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "runuser -u postgres -- psql -d demo -Atqc 'SELECT 1' | grep -qx 1"]
      interval: 2s
      timeout: 2s
      retries: 30

  psql:
    image: pg-oauth-validator-demo:pg18
    profiles: ["client"]
    entrypoint: ["/bin/sh", "/demo/start-external-psql.sh"]
    stdin_open: true
    tty: true
    network_mode: service:postgres
    volumes:
      - external-certs:/certs:ro
      - type: bind
        source: ${OAUTH_PROFILE:-./demo/local/provider.yml}
        target: /demo/profile.yml
        read_only: true
        bind:
          create_host_path: false
    tmpfs:
      - /demo/runtime
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  external-data:
  external-certs:
