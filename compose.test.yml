name: pg-oauth-validator-test

services:
  pg18:
    image: pg-oauth-validator-dev:pg18
    build:
      context: .
      dockerfile: tools/dev/Containerfile
      args:
        PG_MAJOR: "18"
        POSTGRES_IMAGE: postgres:18.6-bookworm@sha256:1c59e2c3c818eaa0f0628f695b36e7c9e362d6b219b36a54a32df645cbd7e1af
    working_dir: /workspace
    environment:
      BUILD_ROOT: /build
      PG_CONFIG_PATH: /usr/lib/postgresql/18/bin/pg_config
      PG_MAJOR: "18"
    volumes:
      - .:/workspace:ro
      - pg18-build:/build
    tmpfs:
      - /source
    entrypoint:
      - /bin/sh
      - /workspace/tools/dev/run-tests.sh
    command:
      - dev-test-pg18

  pg19:
    image: pg-oauth-validator-dev:pg19
    build:
      context: .
      dockerfile: tools/dev/Containerfile
      args:
        PG_MAJOR: "19"
        POSTGRES_IMAGE: postgres:19beta4-bookworm@sha256:4c618d9a30e0b88078b9371a0499d7055da9ab7f5afe386a460758eac9857f06
    working_dir: /workspace
    environment:
      BUILD_ROOT: /build
      PG_CONFIG_PATH: /usr/lib/postgresql/19/bin/pg_config
      PG_MAJOR: "19"
    volumes:
      - .:/workspace:ro
      - pg19-build:/build
    tmpfs:
      - /source
    entrypoint:
      - /bin/sh
      - /workspace/tools/dev/run-tests.sh
    command:
      - dev-test-pg19

volumes:
  pg18-build:
  pg19-build:
