listen_addresses = '*'
port = 5432
hba_file = '/demo/pg_hba.conf'
ident_file = '/demo/pg_ident.conf'
oauth_validator_libraries = 'pg_oauth_validator'
pg_oauth_validator.audiences = 'https://postgres.example/'
pg_oauth_validator.ca_file = '/certs/ca.crt'
ssl = on
ssl_cert_file = '/certs/postgres.crt'
ssl_key_file = '/certs/postgres.key'
log_connections = on
